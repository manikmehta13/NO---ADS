<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>No-Ads Opener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 220px;
      padding: 16px;
      background: #0a0a0f;
      color: #f4f2ff;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    label { font-size: 14px; font-weight: 600; }
    .switch {
      position: relative;
      width: 42px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #333;
      border-radius: 24px;
      transition: 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider { background: linear-gradient(135deg, #FF3CAC, #784BA0, #2B86C5); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(244,242,255,0.5);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="row">
    <label for="toggle">Redirect to No-Ads</label>
    <div class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </div>
  </div>
  <div class="status" id="status">Loading…</div>
  <script src="popup.js"></script>
</body>
</html>
