<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Watch YouTube videos without ads">
  <meta name="keywords" content="YouTube, No Ads, Watch, Videos, Playlist">
  <meta name="author" content="Manik Mehta">
  <title>NO·ADS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <div class="noise"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <header class="site-header">
    <div class="logo-mark">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" rx="8" fill="url(#logoGrad)"/>
        <path d="M10 9.5L20 14L10 18.5V9.5Z" fill="white"/>
        <line x1="6" y1="8" x2="6" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28">
            <stop stop-color="#FF3CAC"/>
            <stop offset="1" stop-color="#784BA0"/>
          </linearGradient>
        </defs>
      </svg>
      <span>NO·ADS</span>
    </div>
    <div class="pill-badge">Ad-free viewing</div>
  </header>

  <main class="main-content">
    <div class="hero-text">
      <h1>Watch YouTube<br><em>without the noise.</em></h1>
      <p class="subtitle">Paste a video or playlist link below and enjoy a clean, distraction-free experience.</p>
    </div>

    <div class="input-card">
      <div class="input-row">
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
          </svg>
          <input type="text" id="videoLink" placeholder="youtube.com/watch?v=... or youtu.be/..." autocomplete="off" spellcheck="false"/>
          <button class="clear-btn" id="clearBtn" onclick="clearInput()" title="Clear">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-primary" onclick="embedVideo()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 000-1.69L9.54 5.98A.998.998 0 008 6.82z"/>
          </svg>
          Play Video
        </button>
        <button class="btn-secondary" onclick="embedPlaylist()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <circle cx="3" cy="6" r="1.2" fill="currentColor"/>
            <circle cx="3" cy="12" r="1.2" fill="currentColor"/>
            <circle cx="3" cy="18" r="1.2" fill="currentColor"/>
          </svg>
          Load Playlist
        </button>
      </div>
    </div>

    <div id="videoSection" class="video-section hidden">
      <div class="video-shell">
        <div class="video-top-bar">
          <span class="video-label" id="videoLabel">Now playing</span>
          <button class="close-video" onclick="closeVideo()" title="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="video-frame-wrap" id="videoContainer"></div>
      </div>
    </div>

    <div class="feature-row">
      <div class="feature-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        No ads, ever
      </div>
      <div class="feature-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        Playlists supported
      </div>
      <div class="feature-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        Installable PWA
      </div>
      <div class="feature-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        Share from any app
      </div>
    </div>

    <p class="footnote">Live streams may not always be supported.</p>
  </main>

  <script src="script.js"></script>
  <script>
    const input = document.getElementById('videoLink');
    const clearBtn = document.getElementById('clearBtn');

    input.addEventListener('input', () => {
      clearBtn.style.opacity = input.value ? '1' : '0';
      clearBtn.style.pointerEvents = input.value ? 'auto' : 'none';
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const v = input.value;
        if (v.includes('list=')) embedPlaylist();
        else embedVideo();
      }
    });

    function clearInput() {
      input.value = '';
      clearBtn.style.opacity = '0';
      clearBtn.style.pointerEvents = 'none';
      input.focus();
    }

    function closeVideo() {
      const sec = document.getElementById('videoSection');
      const container = document.getElementById('videoContainer');
      sec.classList.add('hidden');
      container.innerHTML = '';
    }

    const origEmbedVideo = window.embedVideo;
    const origEmbedPlaylist = window.embedPlaylist;

    window.embedVideo = function() {
      origEmbedVideo();
      const sec = document.getElementById('videoSection');
      document.getElementById('videoLabel').textContent = 'Now playing';
      sec.classList.remove('hidden');
      setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
    };

    window.embedPlaylist = function() {
      origEmbedPlaylist();
      const sec = document.getElementById('videoSection');
      document.getElementById('videoLabel').textContent = 'Playing playlist';
      sec.classList.remove('hidden');
      setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
    };
  </script>
</body>
</html>
